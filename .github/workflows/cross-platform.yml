name: Cross-platform regression

on:
  push:
    branches: [dev, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test portable behavior with isolated stores and simulated native keychains
        run: python -m unittest src.test.python.test_cross_platform src.test.python.test_startup src.test.python.test_workbench src.test.python.test_transcription_settings_manager src.test.python.test_bilibili_subtitle src.test.python.test_lazy_worker_manager src.test.python.test_config_settings src.test.python.test_fast_whisper_transcriber

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
